name: ATS ranking

on:
  schedule:
    # GitHub cron is UTC and scheduled runs can start late or be skipped when
    # GitHub is busy (worst at :00 and :30), so times use odd minutes and each
    # slot has a backup a couple of hours later. Extra runs are harmless:
    # rankings are append-only and the headline is the week's first ranking.
    # Tuesday main run: 13:17 UTC = 6:17am PDT / 5:17am PST; backup 15:47.
    - cron: "17 13 * * 2"
    - cron: "47 15 * * 2"
    # Daily (not Tuesday): 14:07 UTC = 7:07am PDT / 6:07am PST; backup 16:37.
    # Before the Friday deadline this re-ranks; after it, the list is frozen
    # and the run only pulls results and grades.
    - cron: "7 14 * * 0,1,3,4,5,6"
    - cron: "37 16 * * 0,1,3,4,5,6"
    # Last refreshes before the Friday 10pm PT deadline:
    # Sat 02:43 UTC = Fri 7:43pm PDT / 6:43pm PST; backup Fri 8:53pm PDT.
    - cron: "43 2 * * 6"
    - cron: "53 3 * * 6"
  workflow_dispatch:
    inputs:
      kind:
        description: "What to run"
        type: choice
        options: [refresh, weekly, grade]
        default: refresh

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ats-ranking
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      # Raw data is not committed; cache it so past seasons are downloaded
      # once (CFBD free tier is ~1,000 calls/month).
      - name: Restore raw data cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Decide run kind
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/Los_Angeles date +%u)" = "2" ]; then
            # Any scheduled run on a Pacific Tuesday is the weekly run.
            echo "kind=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "kind=refresh" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m ats ${{ steps.kind.outputs.kind }}

      # Save downloads even if a later step fails, so the next run doesn't
      # re-spend CFBD calls refetching history.
      - name: Save raw data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}

      - name: Commit rankings and results
        run: |
          git config user.name "ats-bot"
          git config user.email "ats-bot@users.noreply.github.com"
          # Only add paths that exist (data/results appears after the first grading).
          for p in data/rankings data/results site/data; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          # Uploaded pool-sheet PDFs are converted to CSV by the run; commit
          # the CSV and the PDF's removal (-A stages deletions; PDFs are ignored).
          git add -A data/pickem
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ATS ${{ steps.kind.outputs.kind }} $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
